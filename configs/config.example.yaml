# AI Alert Agent Configuration
# Copy this file to ~/.ai-alert/config.yaml and fill in your values

slack:
  channel: rnd_cyberpunks_alarms  # Slack channel where alerts arrive
  # Bot token and app token should be set via environment variables:
  # export SLACK_BOT_TOKEN="xoxb-..."
  # export SLACK_APP_TOKEN="xapp-..."

sentry:
  organization: arcticwolf  # Sentry organization
  project: cx-collector     # Sentry project slug
  # API token should be set via environment variable:
  # export SENTRY_API_TOKEN="sntrys_..."

claude:
  model: claude-sonnet-5-5  # Model to use (claude-sonnet-5-5 or claude-opus-5-5)
  effort: medium            # Effort level (medium or high) - impacts token usage
  max_tokens: 2048          # Max tokens in response

cloudwatch:
  enabled: true             # Set to false to disable CloudWatch integration
  region: us-west-2         # AWS region
  log_group_prefix: /eks/cx-collector  # CloudWatch log group prefix
  lookback_minutes: 5       # Search window around error time (±minutes)
  # AWS credentials should be configured via:
  # - AWS CLI config (~/.aws/credentials)
  # - Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
  # - IAM role (if running on EKS)

codebase:
  repo_path: /Users/ishan.shah/projects/cx-collector  # Path to cx-collector local clone
  # Must be a valid git repository

storage:
  db_path: ~/.ai-alert/data.db  # SQLite database location (expands ~)

logging:
  dir: ~/.ai-alert/logs     # Log files directory
  level: info               # Log level (debug, info, warning, error)

# Environment variables needed (set in shell or .env file):
#
# Required:
#   SLACK_BOT_TOKEN         Slack bot token (xoxb-...)
#   SLACK_APP_TOKEN         Slack app token for Socket Mode (xapp-...)
#   SENTRY_API_TOKEN        Sentry API token (sntrys_...)
#   ANTHROPIC_API_KEY       Anthropic/Claude API key (sk-ant-...)
#
# Optional:
#   AWS_PROFILE             AWS profile to use (default if not set)
#   AWS_REGION              AWS region override
